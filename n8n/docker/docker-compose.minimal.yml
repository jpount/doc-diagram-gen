version: '3.8'

# Minimal docker-compose without optional components
# Use this if you have issues with the full stack

services:
  # n8n workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-workflow
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_WEBHOOK_URL=http://n8n:5678/
      - WEBHOOK_TUNNEL_URL=http://doc-framework-api:8100/
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
    networks:
      - doc-framework-net
    depends_on:
      - doc-framework-api

  # Documentation Framework API
  doc-framework-api:
    build:
      context: ../..
      dockerfile: n8n/docker/Dockerfile.n8n-api
    container_name: doc-framework-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8100
      - PROJECT_ROOT=/app
      - N8N_WEBHOOK_URL=http://n8n:5678
    volumes:
      # Mount codebase for analysis
      - ../../codebase:/app/codebase:ro
      # Mount output for results
      - ../../output:/app/output
      # Mount framework code for live updates
      - ../../framework:/app/framework:ro
      - ../../n8n:/app/n8n:ro
      - ../../.claude:/app/.claude:ro
    networks:
      - doc-framework-net
  
networks:
  doc-framework-net:
    driver: bridge

volumes:
  n8n_data: