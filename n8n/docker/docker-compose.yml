version: '3.8'

services:
  # n8n workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-workflow
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_WEBHOOK_URL=http://n8n:5678/
      - WEBHOOK_TUNNEL_URL=http://doc-framework-api:8100/
      - N8N_LOG_LEVEL=info
      - N8N_METRICS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
    networks:
      - doc-framework-net
    depends_on:
      - doc-framework-api

  # Documentation Framework API
  doc-framework-api:
    build:
      context: ../..
      dockerfile: n8n/docker/Dockerfile.n8n-api
    container_name: doc-framework-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8100
      - PROJECT_ROOT=/app
      - N8N_WEBHOOK_URL=http://n8n:5678
      - REDIS_URL=redis://redis:6379
    volumes:
      # Mount codebase for analysis
      - ../../codebase:/app/codebase:ro
      # Mount output for results
      - ../../output:/app/output
      # Mount framework code for live updates
      - ../../framework:/app/framework:ro
      - ../../n8n:/app/n8n:ro
      - ../../.claude:/app/.claude:ro
    networks:
      - doc-framework-net
    depends_on:
      - redis

  # Redis for queue and caching
  redis:
    image: redis:7-alpine
    container_name: doc-framework-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doc-framework-net

  # Optional: Celery worker for async task processing (uncomment to enable)
  # celery-worker:
  #   build:
  #     context: ../..
  #     dockerfile: n8n/docker/Dockerfile.n8n-api
  #   container_name: doc-framework-celery
  #   restart: unless-stopped
  #   command: celery -A n8n.services.n8n_celery_tasks worker --loglevel=info
  #   environment:
  #     - PROJECT_ROOT=/app
  #     - REDIS_URL=redis://redis:6379
  #     - CELERY_BROKER_URL=redis://redis:6379
  #     - CELERY_RESULT_BACKEND=redis://redis:6379
  #   volumes:
  #     - ../../codebase:/app/codebase:ro
  #     - ../../output:/app/output
  #     - ../../framework:/app/framework:ro
  #     - ../../n8n:/app/n8n:ro
  #     - ../../.claude:/app/.claude:ro
  #   networks:
  #     - doc-framework-net
  #   depends_on:
  #     - redis

  # Optional: Monitoring dashboard (uncomment to enable)
  # monitoring:
  #   build:
  #     context: ../..
  #     dockerfile: n8n/docker/Dockerfile.n8n-monitoring
  #   container_name: doc-framework-monitoring
  #   restart: unless-stopped
  #   ports:
  #     - "8200:8200"
  #   environment:
  #     - API_URL=http://doc-framework-api:8100
  #     - REDIS_URL=redis://redis:6379
  #   volumes:
  #     - ../../output:/app/output:ro
  #   networks:
  #     - doc-framework-net
  #   depends_on:
  #     - doc-framework-api
  #     - redis

networks:
  doc-framework-net:
    driver: bridge

volumes:
  n8n_data:
  redis_data: